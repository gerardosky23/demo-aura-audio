server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # Immutable Cache for Astro Hashed Bundles
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Media and Video Cache (WebP frames sequence, Hero MP4 video)
    location ~* \.(webp|mp4|jpg|jpeg|png|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, must-revalidate";
    }

    # Clean URLs Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    error_page 404 /index.html;
}
